name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "构建通道：正式 (Release) 对齐官方发行版；最新 (HEAD) 跟随上游最新提交"
        required: false
        type: string
        default: "正式 (Release)"
      cancel_susfs:
        description: "禁用 SUSFS（仅用于构建总结展示）"
        required: false
        type: boolean
        default: false
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_net_enhance:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_kpm:
        description: "KPM 开关（disabled/enabled/patched 选项串，仅用于构建总结展示）"
        required: false
        type: string
        default: "disabled (关闭)"
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces 槽位（off/678/123/345）"
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      summary_profile:
        description: "构建总结档案：kernel=通用内核工作流；fastbuild=6.12.69 快速构建；mi15=小米系专用 6.6.118（选项集各异）"
        required: false
        type: string
        default: "kernel"
      xiaomi_backport:
        description: "小米系回移补丁开关（仅用于构建总结展示）"
        required: false
        type: boolean
        default: true
      use_lz4:
        required: false
        type: boolean
        default: false
      use_lz4kd:
        required: false
        type: boolean
        default: false
      bbr_mode:
        description: "BBR 模式（false/true/default 选项串，仅用于构建总结展示）"
        required: false
        type: string
        default: "false"
      use_adios:
        required: false
        type: boolean
        default: false
      ccache_update:
        required: false
        type: boolean
        default: false
      ccache_debug:
        required: false
        type: boolean
        default: false
      kernel_suffix:
        description: "内核后缀（仅用于构建总结展示）"
        required: false
        type: string
        default: ""
      droidspaces_mode:
        description: "Droidspaces 模式（false/standard/extend，仅用于构建总结展示）"
        required: false
        type: string
        default: "false"
      artifact_upload_mode:
        required: false
        type: string
        default: "仅上传 AnyKernel3.zip"
      version:
        description: "自定义版本名（留空=默认）"
        required: false
        type: string
        default: ""
      build_time:
        description: "自定义构建时间（留空=自动获取当前北京时间）"
        required: false
        type: string
        default: ""
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerVer:
        description: "官方 Manager 构建的实测版本号"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}

      ksuCommit:
        description: "内核侧对齐用的提交 SHA（正式通道=Release 标签提交；最新通道=所选 CI 构建提交或 HEAD）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}

      channelTag:
        description: "正式通道选用的 Release 标签（最新通道或回退时为空）"
        value: ${{ jobs.get_ksu_manager.outputs.channelTag }}

      managerCertSize:
        description: "FinaSU 管理器签名证书 DER 尺寸（0x 十六进制，内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}

      managerCertHash:
        description: "FinaSU 管理器签名证书 SHA256（内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
      # 输出3: Manager 实测版本号
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # 输出4: 内核侧对齐用的提交 SHA（正式通道=Release 标签提交；最新通道=空）
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # 输出5: 正式通道选用的 Release 标签
      channelTag: ${{ steps.add_KSU.outputs.channelTag }}
      # 输出6/7: FinaSU 管理器签名证书（内核第二信任槽对齐用）
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}

    steps:
      - name: 检出脚本仓库
        uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq unzip

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU-Nova" ]; then
            echo "This is the SukiSU-Nova variant"
            # 上游整包约 78MB（大头是管理器资源和历史 blob），CI 上完整克隆要三四分钟。
            # 这里只取提交与树对象（--filter=blob:none，约 7MB），需要某个文件时 git 再按需
            # 抓那一个 blob；版本号用本地 rev-list 统计，不额外依赖网络接口。
            git clone --filter=blob:none --no-checkout https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU-Nova" ]; then
            # 版本公式随上游发布调整（VERSION_BASE/OFFSET 与加减号都会变），按源码求值
            KSU_VERSION=$(bash "$GITHUB_WORKSPACE/.github/scripts/ksu-version.sh" . HEAD)
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU 内核 Kbuild 与管理器 build.gradle.kts 均以 30000 + git 提交数计算版本
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      # ==================== 构建通道 ====================
      # 正式：管理器取官方「正式版」Release（prerelease=false，标签提交 + 该 Release 的 APK）；
      #       上游没有正式版 Release 时（如 BakaSU 只有 rc 预发布），
      #       改用官方默认分支最新上传构建，内核仍锁定该构建提交
      # 最新：管理器取与默认分支 HEAD 版本一致的最新构建（不限分支），内核锁定该 HEAD；
      #       BakaSU/FinaSU 直接取 build-manager.yml 最新构建，内核锁定该构建提交
      - name: 选择管理器来源（构建通道）
        env:
          # secret 与 variable 都认，避免把它误存成「变量」时静默取到空值
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || vars.CNB_TOKEN }}
        run: |

          CHANNEL_RAW="${{ inputs.build_channel }}"
          case "$CHANNEL_RAW" in
            最新*|latest*|HEAD*) CHANNEL_KIND="latest"; PIN_MODE="head" ;;
            *)                   CHANNEL_KIND="release"; PIN_MODE="pin" ;;
          esac
          echo "构建通道: $CHANNEL_RAW -> $CHANNEL_KIND (pin_mode=$PIN_MODE)"

          # 上游仓库：SukiSU-Nova 已迁到自建 Forgejo（git.zako.shirkneko.top），
          # 版本公式、管理器 versionCode 与发布都只在这个仓库更新；GitHub 上的
          # SukiSU-Nova/SukiSU-Nova 只是停在改名前的镜像，版本号会整体偏高。
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU-Nova")
              REPO="shirkneko/SukiSU"
              PREF="universal"
              API_BASE="https://git.zako.shirkneko.top:20004/api/v1/repos/shirkneko/SukiSU"
              GIT_URL="https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git"
              AUTH_HEADER=""
              ;;
            "BakaSU")
              REPO="Baka-SU/BakaSU"
              PREF="arm64"
              API_BASE="https://api.github.com/repos/Baka-SU/BakaSU"
              GIT_URL="https://github.com/Baka-SU/BakaSU.git"
              AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
              ;;
            "FinaSU")
              REPO="LyraVoid/FinaSU"
              PREF="universal"
              API_BASE="https://api.github.com/repos/LyraVoid/FinaSU"
              GIT_URL="https://github.com/LyraVoid/FinaSU.git"
              AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
              ;;
            *) echo "::error::未知变体"; exit 1 ;;
          esac

          {
            echo "CHANNEL_KIND=$CHANNEL_KIND"
            echo "PIN_MODE=$PIN_MODE"
            echo "MANAGER_REPO=$REPO"
            echo "MANAGER_SOURCE=ci"
          } >> "$GITHUB_ENV"

          if [ "$CHANNEL_KIND" != "release" ]; then
            # SukiSU-Nova 的测试版管理器有两个来源：cnb.cool 的滚动测试包
            # （公开可读，令牌可选）与上游 Forgejo Actions 产物（只保留 7 天）。
            CNB_CODE=000
            if [ "${{ inputs.kernelsu_variant }}" = "SukiSU-Nova" ]; then
              # 滚动测试包是 cnb.cool 上公开仓库（sukisu-nova/Release）manager-ci 分支里的
              # 文件，匿名可读，不再依赖令牌；这里探一下可达性，结果留给后面的回退判断。
              CNB_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                "https://cnb.cool/sukisu-nova/Release/-/git/raw/manager-ci/manifest.json" 2>/dev/null || true)
              [ -n "$CNB_CODE" ] || CNB_CODE=000
              if [ "$CNB_CODE" = "200" ]; then
                echo "cnb 滚动测试包可访问（manager-ci）"
              else
                echo "::warning title=cnb 不可访问::manager-ci/manifest.json 返回 HTTP $CNB_CODE，最新通道只能退回 Forgejo 上未过期的旧产物"
              fi
            fi
            # 两者都拿不到时退回正式版 Release，避免本次构建没有管理器。
            if [ "${{ inputs.kernelsu_variant }}" = "SukiSU-Nova" ] && [ "${CNB_CODE:-000}" != "200" ]; then
              ART_COUNT=$(curl -s --fail --max-time 30 "$API_BASE/actions/artifacts?limit=50" 2>/dev/null \
                | jq "[ .[] | select(.name == \"sukisu-manager\" and (.expired | not)) ] | length" 2>/dev/null || echo 0)
              if [ "${ART_COUNT:-0}" -eq 0 ]; then
                echo "::warning title=最新通道回退::cnb 与上游 Forgejo 都没有可用的测试版管理器，本次改用正式版 Release"
                CHANNEL_KIND="release"; PIN_MODE="pin"
                echo "CHANNEL_KIND=$CHANNEL_KIND" >> "$GITHUB_ENV"
                echo "PIN_MODE=$PIN_MODE" >> "$GITHUB_ENV"
              fi
            fi
            if [ "$CHANNEL_KIND" != "release" ]; then
              echo "最新通道：内核锁定默认分支 HEAD，管理器取与 HEAD 版本一致的最新构建"
              exit 0
            fi
          fi

          # ---------- 正式通道：解析官方 Release ----------
          REL_JSON=""
          for ATTEMPT in 1 2 3; do
            if [ -n "${AUTH_HEADER:-}" ]; then
              REL_JSON=$(curl -s --fail --max-time 30 -H "$AUTH_HEADER" \
                -H "Accept: application/vnd.github+json" \
                "$API_BASE/releases?per_page=40&limit=40") && [ -n "$REL_JSON" ] && break
            else
              REL_JSON=$(curl -s --fail --max-time 30 \
                "$API_BASE/releases?limit=40") && [ -n "$REL_JSON" ] && break
            fi
            echo "获取 $REPO 的 Release 列表失败，重试 ($ATTEMPT/3)..."
            REL_JSON=""
            sleep 5
          done

          # 选择规则：
          #   1) 跳过草稿与滚动发布标签（manager-ci / nightly / latest 等，其内容始终是最新 CI 产物）
          #   2) 只保留带 APK 资产的 Release（排除 debug / spoofed 包）
          #   3) 只接受正式版（prerelease=false）：rc / beta 等预发布属于"最新"范畴，正式通道不取
          #   4) ABI 偏好：BakaSU 取 arm64-v8a，其余优先 universal
          PICK=""
          if [ -n "$REL_JSON" ]; then
            PICK=$(printf '%s' "$REL_JSON" | jq -r --arg pref "$PREF" '
              [ .[] | select(.draft == false) ]
              | map(. + { _ts: (.published_at // .created_at // "") })
              | sort_by(._ts) | reverse
              | map(. + {
                  _rolling: (.tag_name | test("(?i)^(manager-ci|manager_ci|nightly|latest|ci)$")),
                  _apks: [ .assets[]?
                           | select(.name | test("\\.apk$"; "i"))
                           | select(.name | test("(?i)debug|spoofed") | not) ]
                })
              | map(. + {
                  _apks: (._apks | sort_by(
                    if   (.name | test("(?i)" + $pref)) then 0
                    elif (.name | test("(?i)universal")) then 1
                    elif (.name | test("(?i)arm64")) then 2
                    else 3 end))
                })
              | map(select((._rolling | not) and ((._apks | length) > 0)))
              | map(select(.prerelease | not))
              | .[0] as $p
              | if $p then
                  [ $p.tag_name, ( $p.prerelease | tostring ), $p._apks[0].name, $p._apks[0].browser_download_url ] | @tsv
                else empty end
            ')
          fi

          if [ -z "$PICK" ]; then
            echo "::notice::$REPO 没有可用的正式版 Release（仅预发布或未附 APK），改用官方默认分支最新上传构建（内核仍锁定该提交）"
            exit 0
          fi

          IFS=$'\t' read -r REL_TAG REL_PRE REL_APK_NAME REL_APK_URL <<< "$PICK"

          # 解析 Release 标签对应的提交（优先本地克隆，回退远端查询）
          REL_COMMIT=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$REL_COMMIT" ]; then
            # annotated tag 需解引用，否则拿到的是标签对象而非提交
            REL_COMMIT=$(git ls-remote "$GIT_URL" "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            REL_COMMIT=$(git ls-remote "$GIT_URL" "refs/tags/${REL_TAG}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            echo "::warning title=正式通道回退::无法解析 Release $REL_TAG 对应的提交，改用官方默认分支最新上传构建"
            exit 0
          fi

          {
            echo "MANAGER_SOURCE=release"
            echo "REL_TAG=$REL_TAG"
            echo "REL_COMMIT=$REL_COMMIT"
            echo "REL_APK_NAME=$REL_APK_NAME"
            echo "REL_APK_URL=$REL_APK_URL"
          } >> "$GITHUB_ENV"

          if [ "$REL_PRE" = "true" ]; then
            echo "::notice::上游无正式版，选用最新预发布版 $REL_TAG"
          fi
          echo "正式通道：Release $REL_TAG (${REL_COMMIT:0:8})，管理器 $REL_APK_NAME"

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
          BUILD_CHANNEL_INPUT: ${{ inputs.build_channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN || vars.CNB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/get-ksu-manager.sh"

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          # 上游 susfs4ksu-module 的 Actions artifacts 已全部过期，
          # 模块现通过 GitHub Releases 发布，改为拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 susfs4ksu-module 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 ksu_module_susfs 模块 zip"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "下载 SUSFS 模块: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "下载 SUSFS 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Release 资产本身即完整模块 zip，校验完整性后直接放入模块目录
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "下载的 SUSFS 模块 zip 损坏"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: 构建总结
        if: always()
        run: |
          VARIANT="${{ inputs.kernelsu_variant }}"
          MANAGER_VER="${{ steps.add_KSU.outputs.managerVer }}"
          [ -n "$MANAGER_VER" ] || MANAGER_VER="未获取"

          # SukiSU-Nova 跳过「选择管理器来源」步骤，CHANNEL_KIND 从未写入 env；
          # 与 add_KSU 的兜底一致，直接按输入判断通道
          CHANNEL_KIND="${CHANNEL_KIND:-}"
          if [ -z "$CHANNEL_KIND" ]; then
            case "${{ inputs.build_channel }}" in
              最新*|latest*|HEAD*) CHANNEL_KIND="latest" ;;
              *)                   CHANNEL_KIND="release" ;;
            esac
          fi

          case "${CHANNEL_KIND:-}" in
            latest) CH_LABEL="最新通道（HEAD）" ;;
            *)      CH_LABEL="正式通道（Release）" ;;
          esac

          flag() { [ "$1" = "true" ] && echo "✅ 启用" || echo "➖ 关闭"; }

          if [ "${{ inputs.cancel_susfs }}" = "true" ]; then
            SUS_ROW="⛔ 禁用"
          else
            SUS_ROW="✅ 启用"
          fi

          DS_SLOT="${{ inputs.droidspaces }}"
          if [ -z "$DS_SLOT" ] || [ "$DS_SLOT" = "off" ]; then
            DS_ROW="➖ 关闭"
          elif [ "${{ inputs.droidspaces_ntsync }}" = "true" ]; then
            DS_ROW="✅ 槽位 $DS_SLOT + NTSync"
          else
            DS_ROW="✅ 槽位 $DS_SLOT"
          fi

          case "${{ inputs.use_kpm }}" in
            disabled*) KPM_ROW="➖ 关闭" ;;
            patched*)  KPM_ROW="✅ 开启并修补" ;;
            *)         KPM_ROW="✅ 开启" ;;
          esac

          VER_ROW="${{ inputs.version }}"
          [ -n "$VER_ROW" ] || VER_ROW="默认"
          TIME_ROW="${{ inputs.build_time }}"
          [ -n "$TIME_ROW" ] || TIME_ROW="自动（当前北京时间）"

          # fastbuild / mi15 档案：选项集与通用内核工作流不同，各自单独成表
          PROFILE="${{ inputs.summary_profile }}"
          case "${{ inputs.droidspaces_mode }}" in
            standard) DS_MODE_ROW="✅ 开启（含 NTSync）" ;;
            extend)   DS_MODE_ROW="✅ 开启（扩展测试项）" ;;
            *)        DS_MODE_ROW="➖ 关闭" ;;
          esac
          case "${{ inputs.bbr_mode }}" in
            true)    BBR_ROW="✅ 编入算法" ;;
            default) BBR_ROW="✅ 编入并设为默认" ;;
            *)       BBR_ROW="➖ 关闭" ;;
          esac
          SUFFIX_ROW="${{ inputs.kernel_suffix }}"
          [ -n "$SUFFIX_ROW" ] || SUFFIX_ROW="默认"
          FB_TIME_ROW="${{ inputs.build_time }}"
          [ -n "$FB_TIME_ROW" ] || FB_TIME_ROW="内置默认（Mon Jul 20 18:34:35 UTC 2026）"
          if [ "${{ inputs.xiaomi_backport }}" = "true" ]; then
            XM_ROW="✅ 启用（erofs-fsoffset + f2fs-fault_report）"
          else
            XM_ROW="➖ 关闭"
          fi
          if { [ "$PROFILE" = "fastbuild" ] || [ "$PROFILE" = "mi15" ]; } && [ "$VARIANT" != "SukiSU-Nova" ]; then
            case "$KPM_ROW" in
              *关闭*) : ;;
              *) KPM_ROW="$KPM_ROW（仅 SukiSU-Nova 生效）" ;;
            esac
          fi

          {
            echo "## 构建总结"
            echo ""
            echo "**$VARIANT** · 管理器 \`$MANAGER_VER\` · $CH_LABEL"
            echo ""
            echo "### 构建选项"
            echo ""
            echo "| 功能 | 选择 |"
            echo "|:---|:---|"
            if [ "$PROFILE" = "fastbuild" ]; then
              echo "| SUSFS | $SUS_ROW |"
              echo "| KPM | $KPM_ROW |"
              echo "| Droidspaces 容器 | $DS_MODE_ROW |"
              echo "| LZ4 + zstd 补丁 | $(flag "${{ inputs.use_lz4 }}") |"
              echo "| LZ4KD 补丁 | $(flag "${{ inputs.use_lz4kd }}") |"
              echo "| BBR 算法 | $BBR_ROW |"
              echo "| 网络功能拓展 | $(flag "${{ inputs.use_net_enhance }}") |"
              echo "| ADIOS IO 调度器 | $(flag "${{ inputs.use_adios }}") |"
              echo "| Re-Kernel | $(flag "${{ inputs.use_rekernel }}") |"
              echo "| 内核级基带保护 | $(flag "${{ inputs.use_bbg }}") |"
              echo "| ccache 缓存更新 | $(flag "${{ inputs.ccache_update }}") |"
              echo "| ccache 调试日志 | $(flag "${{ inputs.ccache_debug }}") |"
              echo "| 内核后缀 | $SUFFIX_ROW |"
              echo "| 自定义构建时间 | $FB_TIME_ROW |"
            elif [ "$PROFILE" = "mi15" ]; then
              echo "| 小米系回移补丁 | $XM_ROW |"
              echo "| SUSFS | $SUS_ROW |"
              echo "| KPM | $KPM_ROW |"
              echo "| BBR 算法 | $BBR_ROW |"
              echo "| 网络功能拓展 | $(flag "${{ inputs.use_net_enhance }}") |"
              echo "| 内核级基带保护 | $(flag "${{ inputs.use_bbg }}") |"
              echo "| ccache 缓存更新 | $(flag "${{ inputs.ccache_update }}") |"
              echo "| ccache 调试日志 | $(flag "${{ inputs.ccache_debug }}") |"
              echo "| 内核后缀 | $SUFFIX_ROW |"
              echo "| 自定义构建时间 | $FB_TIME_ROW |"
            else
              echo "| SUSFS | $SUS_ROW |"
              echo "| Droidspaces 容器 | $DS_ROW |"
              echo "| ZRAM 压缩 | $(flag "${{ inputs.use_zram }}") |"
              echo "| BBG 基带保护 | $(flag "${{ inputs.use_bbg }}") |"
              echo "| 网络增强 | $(flag "${{ inputs.use_net_enhance }}") |"
              echo "| Re-Kernel 驱动 | $(flag "${{ inputs.use_rekernel }}") |"
              echo "| KPM | $KPM_ROW |"
              echo "| \`CVE-2026-43499\` 修复 | $(flag "${{ inputs.cve_2026_43499_patch }}") |"
              echo "| 产物上传模式 | ${{ inputs.artifact_upload_mode }} |"
              echo "| 自定义版本名 | ${VER_ROW} |"
              echo "| 自定义构建时间 | ${TIME_ROW} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
