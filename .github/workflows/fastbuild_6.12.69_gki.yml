# 移植自上游 cctv18/oppo_oplus_realme_sm8850
# 原始工作流: https://github.com/cctv18/oppo_oplus_realme_sm8850/blob/main/.github/workflows/fastbuild_6.12.69_gki.yml
# 构建时拉取上游 cctv18 的 GKI 源码、LLVM/Clang 19 + Rust 工具链及附属补丁
name: (新版米/通用GKI) 6.12.69 GKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '69_gki'
  KERNEL_NAME: 'android16-5-ga8f88ad96df3-ab13929693-4k'
  CCACHE_KEY: ccache-ecsv4-gki-6.12.69

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: '内置KernelSU(SukiSU/FinaSU/BakaSU/无内置KSU,默认FinaSU)'
        required: true
        type: choice
        default: 'finasu'
        options:
          - 'finasu'
          - 'bakasu'
          - 'sukisu'
          - 'none'
      build_channel:
        description: '构建通道（正式=官方 Release 发行版，最新=上游最新提交）'
        required: false
        type: choice
        options:
          - '正式 (Release)'
          - '最新 (HEAD)'
        default: '正式 (Release)'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启KPM内核模块支持(仅SukiSU生效; 需配合支持KPM的管理器使用, 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  get-ksu-manager:
    # ksu_type=none 时无管理器可拉取；构建作业照常运行，各变体跟随分支 HEAD
    if: ${{ inputs.ksu_type != 'none' }}
    # get-manager 声明了 contents: write / actions: read，调用方必须显式授予更高或同等权限，
    # 否则派发阶段直接 startup_failure（默认令牌为 contents: read / actions: none）
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.ksu_type == 'finasu' && 'FinaSU' || inputs.ksu_type == 'bakasu' && 'BakaSU' || 'SukiSU' }}
      build_channel: ${{ inputs.build_channel }}
      # 本工作流选项集与通用内核工作流不同，构建总结按 fastbuild 档案渲染
      summary_profile: fastbuild
      cancel_susfs: ${{ !inputs.susfs_enable }}
      use_bbg: ${{ inputs.baseband_guard }}
      use_net_enhance: ${{ inputs.better_net }}
      use_rekernel: ${{ inputs.rekernel_enable }}
      use_kpm: ${{ inputs.kpm_enable && 'enabled (开启)' || 'disabled (关闭)' }}
      use_lz4: ${{ inputs.lz4_enable }}
      use_lz4kd: ${{ inputs.lz4kd_enable }}
      bbr_mode: ${{ inputs.bbr_enable }}
      use_adios: ${{ inputs.adios_enable }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      droidspaces_mode: ${{ inputs.droidspaces_enable }}

  build:
    needs: get-ksu-manager
    # 管理器作业被跳过或失败时不阻塞构建；ksuCommit 为空时跟随各变体分支 HEAD
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      # SukiSU 需要仓库内的 scripts/ksu_post_setup.sh、ksu_uapi_sync、sukisu_compat；
      # 本工作流其余步骤都不依赖本仓库检出，故仅 SukiSU 时稀疏拉取 scripts/ 目录
      - name: 检出构建脚本
        if: inputs.ksu_type == 'sukisu'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts

      - name: 安装环境依赖+初始化源码仓库及llvm-clang19工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev &
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）
          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev libdw-dev zip unzip ccache
          
          #使用最新版ccache v4.12.2（Ubuntu软件仓库的版本并非最新）
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/android16-6.12-2026-03.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_gki_kernel_common-android16-6.12-2026-03" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang19工具链..." &&
          mkdir -p clang19 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip &&
          unzip -q clang.zip -d clang19 &&
          rm -rf clang.zip &
          
          echo "正在克隆Rust 1.82.0工具链..." &&
          mkdir -p rust &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip &&
          unzip -q rust.zip -d rust &&
          rm -rf rust.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-clang19工具链初始化完成！"
          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        env:
          KSU_PIN: ${{ needs.get-ksu-manager.outputs.ksuCommit }}
          KSU_PIN_CERT_SIZE: ${{ needs.get-ksu-manager.outputs.managerCertSize }}
          KSU_PIN_CERT_HASH: ${{ needs.get-ksu-manager.outputs.managerCertHash }}
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "finasu" ]]; then
            echo "正在配置FinaSU..."
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
            cd KernelSU
            # 对齐 get-manager 选定的提交：正式通道为 Release 标签提交，最新通道为管理器构建提交；
            # Kbuild 以 30000 + git 提交数计算版本，与管理器 versionCode 同源同值
            if [ -n "$KSU_PIN" ]; then
              if ! git checkout -q --detach "$KSU_PIN" 2>/dev/null; then
                git fetch -q origin "$KSU_PIN"
                git checkout -q --detach "$KSU_PIN"
              fi
              [ "$(git rev-parse HEAD)" = "$KSU_PIN" ] || { echo "::error::KernelSU 检出管理器提交 $KSU_PIN 失败，无法对齐版本"; exit 1; }
              echo "KernelSU 已检出到管理器构建提交 $KSU_PIN (KSU 版本 $((30000 + $(git rev-list --count HEAD))))"
            fi
            KSU_VERSION=$(expr $(git rev-list --count HEAD) + 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            cd ..
            # FinaSU 自带的 kernel/setup.sh 仍会克隆上游 tiann/KernelSU，这里手动完成树内集成
            DRIVER_DIR="$(pwd)/common/drivers"
            ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$(pwd)/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
            grep -q "obj-.*CONFIG_KSU.*kernelsu/" "$DRIVER_DIR/Makefile" || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$DRIVER_DIR/Makefile"
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"; then
              sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
            fi
            # 将官方管理器签名证书写入第二信任槽，否则 FinaSU 管理器会显示“未安装”
            # 优先用 get-manager 从对应通道管理器提取的证书；拿不到时回退到最新 Release APK 现场提取
            KSU_CERT_SIZE="$KSU_PIN_CERT_SIZE"
            KSU_CERT_HASH="$KSU_PIN_CERT_HASH"
            if [ -n "$KSU_CERT_SIZE" ] && [ -n "$KSU_CERT_HASH" ]; then
              echo "使用 get-manager 提取的管理器签名证书: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
            else
              wget -q https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/scripts/finasu_compat/extract_manager_cert.py -O /tmp/extract_manager_cert.py
              REL_JSON=$(curl -s --fail --max-time 30 -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/LyraVoid/FinaSU/releases/latest)
              REL_URL=$(printf '%s' "$REL_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.apk')))")
              curl -sL --fail --retry 3 --max-time 300 -o /tmp/finasu-manager.apk "$REL_URL"
              CERT_INFO=$(python3 /tmp/extract_manager_cert.py /tmp/finasu-manager.apk | head -n1)
              KSU_CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
              KSU_CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
            fi
            if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
              echo "::error::FinaSU 管理器签名证书提取失败"
              exit 1
            fi
            echo "注入 FinaSU 管理器签名证书: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
            awk -v size="$KSU_CERT_SIZE" -v hash="$KSU_CERT_HASH" '
              !done && /^ccflags-y \+= -DEXPECTED_HASH=/ {
                print
                print "# injected for FinaSU manager signature"
                print "KSU_EXPECTED_SIZE2 := " size
                print "KSU_EXPECTED_HASH2 := " hash
                print "KSU_SECOND_SIGNATURE_RELEASE := 1"
                done = 1
                next
              }
              { print }
            ' KernelSU/kernel/Kbuild > KernelSU/kernel/Kbuild.new && mv KernelSU/kernel/Kbuild.new KernelSU/kernel/Kbuild
            grep -q "^KSU_EXPECTED_SIZE2 := " KernelSU/kernel/Kbuild \
              && grep -q "^KSU_EXPECTED_HASH2 := " KernelSU/kernel/Kbuild \
              && grep -q "^KSU_SECOND_SIGNATURE_RELEASE := 1" KernelSU/kernel/Kbuild \
              || { echo "::error::FinaSU Kbuild 管理器证书注入失败"; exit 1; }
            # CI 检出的分支名不是 master，把完整版本的分支段固定为品牌名
            sed -i 's/@$(KSU_VERSION_BRANCH)/@xuyi/' KernelSU/kernel/Kbuild
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置BakaSU..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@xuyi"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            # 对齐 get-manager 选定的提交：正式通道为 Release 标签提交，最新通道为管理器构建提交；
            # Kbuild 以 30700 + git 提交数计算版本，与管理器 versionCode 同源同值
            if [ -n "$KSU_PIN" ]; then
              if ! git checkout -q --detach "$KSU_PIN" 2>/dev/null; then
                git fetch -q origin "$KSU_PIN"
                git checkout -q --detach "$KSU_PIN"
              fi
              [ "$(git rev-parse HEAD)" = "$KSU_PIN" ] || { echo "::error::KernelSU 检出管理器提交 $KSU_PIN 失败，无法对齐版本"; exit 1; }
              echo "KernelSU 已检出到管理器构建提交 $KSU_PIN (KSU 版本 $((30700 + $(git rev-list --count HEAD))))"
            fi
            # 与 BakaSU 内核侧版本号算法一致：30000 + 提交数 + 700
            KSU_VERSION=$(expr $(git rev-list --count HEAD) + 30700)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "正在配置SukiSU..."
            # 开启 SUSFS 时用 builtin 分支（内建 SUSFS 支持与 Inline hook），关闭时用 main
            if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
              SUKISU_BRANCH=builtin
            else
              SUKISU_BRANCH=main
            fi
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$SUKISU_BRANCH"
            cd ./KernelSU
            # 对齐 get-manager 选定的提交：SukiSU 的 builtin 分支与 main 内容不同，不能直接检出，
            # 改为把内核侧版本来源 REPO_BRANCH 改写为该提交（main 在 kernel/Kbuild，builtin 在 kernel/Makefile）
            if [ -n "$KSU_PIN" ]; then
              if ! git fetch -q origin "$KSU_PIN" 2>/dev/null; then
                echo "管理器构建提交 $KSU_PIN 已存在于本地克隆，跳过 fetch"
              fi
              if ! git cat-file -e "$KSU_PIN^{commit}" 2>/dev/null; then
                echo "::error::管理器构建提交 $KSU_PIN 不在 KernelSU 仓库中，无法对齐版本来源"
                exit 1
              fi
              if [ "$SUKISU_BRANCH" = "builtin" ]; then
                KSU_VERSION_SOURCE="kernel/Makefile"
              else
                KSU_VERSION_SOURCE="kernel/Kbuild"
              fi
              sed -i -E "s|^(REPO_BRANCH[[:space:]]*[:?+]?=)[[:space:]]*main[[:space:]]*\$|\1 $KSU_PIN|" "$KSU_VERSION_SOURCE"
              grep -qE "^REPO_BRANCH[[:space:]]*[:?+]?=[[:space:]]*$KSU_PIN[[:space:]]*\$" "$KSU_VERSION_SOURCE" \
                || { echo "::error::未能在 $KSU_VERSION_SOURCE 中对齐 REPO_BRANCH（上游结构可能已变化），无法对齐管理器版本"; exit 1; }
              echo "SukiSU 内核侧版本来源已对齐管理器构建提交 $KSU_PIN (KSU 版本 $((40000 + $(git rev-list --count "$KSU_PIN") - 2815)))"
            fi
            # 与 SukiSU 内核侧算法一致：40000 + 提交数 - 2815（官方管理器 versionCode 同源）
            if [ -n "$KSU_PIN" ]; then
              KSU_VERSION=$(expr $(git rev-list --count "$KSU_PIN") + 40000 - 2815)
            else
              KSU_VERSION=$(expr $(git rev-list --count main) + 40000 - 2815)
            fi
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            cd ..
            # 内核完整版本的 @<branch> 固定为品牌名（CI 检出非 main 分支时管理器显示 @xuyi）
            bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU sukisu
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 SukiSU 内核兼容补丁
        if: inputs.ksu_type == 'sukisu'
        run: |
          cd kernel_workspace
          # builtin 与官方 main 的 UAPI 需对齐，否则管理器首页会提示"需要更新内核"
          bash "$GITHUB_WORKSPACE/scripts/ksu_uapi_sync/sync_uapi.sh" KernelSU
          # 6.8+ security_add_hooks 新签名 / builtin 的 seccomp 过滤模式（内容检测，上游已修复则自动跳过）
          bash "$GITHUB_WORKSPACE/scripts/sukisu_compat/apply.sh" KernelSU

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            if [[ "${{ github.event.inputs.ksu_type }}" == "sukisu" ]]; then
              # SukiSU builtin 驱动无条件调用 priority uid filter 接口，cctv18 oki v2.3.0 没有这些符号；
              # 改用 susfs4ksu gki-android16-6.12 (v2.4.0)，并交给 susfs_fixes 统一适配（守卫归一化等）
              echo "正在添加susfs补丁（SukiSU: susfs4ksu gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}）..."
              git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
              KERNEL_ROOT="$(pwd)" SUSFS4KSU="$(pwd)/susfs4ksu" KERNEL_PATCHES="$(pwd)/kernel_patches" \
                ANDROID_VERSION="${{ env.ANDROID_VERSION }}" KERNEL_VERSION="${{ env.KERNEL_VERSION }}" \
                KSU_VARIANT=SukiSU OS_PATCH_LEVEL= LEGACY_SUKISU_CONFIG= SUB_LEVEL="${SUB_VERSION%%_*}" \
                bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"
            else
              echo "正在添加susfs补丁..."
              git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
              cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
              cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
              cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
              cd ./common
              patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
              # FinaSU 的 Inline 后端还要求 fs/exec.c 中的 preinit 直调点，cctv18 补丁未包含
              if [[ "${{ github.event.inputs.ksu_type }}" == "finasu" ]] && grep -q '^config KSU_HOOK_SUSFS_INLINE' ../KernelSU/kernel/Kconfig; then
                echo "正在补充 FinaSU Inline 所需的 preinit 调用点..."
                wget -q "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/finasu_inline_preinit_6.12.patch" -O /tmp/finasu_inline_preinit_6.12.patch
                patch -p1 -F 3 < /tmp/finasu_inline_preinit_6.12.patch
                grep -q 'preinit_fd = ksu_setup_preinit_file(&filename' fs/exec.c \
                  && grep -q 'ksu_preinit_handle_post_execveat(&fd' fs/exec.c \
                  || { echo "::error::FinaSU Inline preinit 调用点补丁应用失败"; exit 1; }
              fi
              cd ..
            fi
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          
      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
